<!DOCTYPE html>  
<html lang="es">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />  
  <meta name="apple-mobile-web-app-capable" content="yes" />  
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />  
  <meta name="apple-mobile-web-app-title" content="Habilidades" />  
  <meta name="theme-color" content="#090b10" />  
  <title>Habilidades</title>  
  <script src="https://cdn.tailwindcss.com"></script>  
  <style>  
    :root {  
      --bg: #090b10;  
      --surface: #11151f;  
      --surface-2: #171c29;  
      --border: rgba(255, 255, 255, 0.08);  
      --text: #f3f5f8;  
      --muted: #8f98ad;  
      --accent: #38bdf8;  
      --ok: #22c55e;  
      --danger: #ef4444;  
    }  
  
    * {  
      box-sizing: border-box;  
      -webkit-tap-highlight-color: transparent;  
    }  
  
    html,  
    body {  
      margin: 0;  
      padding: 0;  
      background-color: var(--bg);  
      color: var(--text);  
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;  
      min-height: 100dvh;  
      overflow-x: hidden;  
    }  
  
    .app-shell {  
      width: 100%;  
      max-width: 640px;  
      margin: 0 auto;  
      padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 28px);  
    }  
  
    .surface-card {  
      background-color: var(--surface);  
      border: 1px solid var(--border);  
      border-radius: 12px;  
    }  
  
    .surface-elevated {  
      background-color: var(--surface-2);  
      border: 1px solid var(--border);  
      border-radius: 10px;  
    }  
  
    .bar-track {  
      flex: 1;  
      height: 7px;  
      background-color: var(--surface-2);  
      border-radius: 9999px;  
      overflow: hidden;  
    }  
  
    .bar-fill {  
      height: 100%;  
      border-radius: 9999px;  
      transition: width 0.14s ease;  
    }  
  
    .action-btn {  
      border: 1px solid var(--border);  
      background-color: var(--surface-2);  
      color: var(--text);  
      border-radius: 8px;  
      padding: 6px 10px;  
      font-size: 0.78rem;  
      font-weight: 600;  
      cursor: pointer;  
      transition: transform 0.08s ease, opacity 0.15s ease;  
    }  
  
    .action-btn:active {  
      transform: scale(0.97);  
    }  
  
    .action-btn:disabled {  
      opacity: 0.35;  
      cursor: not-allowed;  
    }  
  
    .action-btn.primary {  
      border-color: transparent;  
      color: #071018;  
    }  
  
    .action-btn.danger {  
      color: #fca5a5;  
      border-color: rgba(239, 68, 68, 0.28);  
    }  
  
    input[type="text"],  
    input[type="number"],  
    textarea {  
      width: 100%;  
      background-color: var(--surface-2);  
      border: 1px solid var(--border);  
      color: var(--text);  
      border-radius: 8px;  
      padding: 8px 10px;  
      font-size: 0.85rem;  
      outline: none;  
    }  
  
    input[type="text"]:focus,  
    input[type="number"]:focus,  
    textarea:focus {  
      border-color: rgba(56, 189, 248, 0.55);  
    }  
  
    input[type="color"] {  
      width: 100%;  
      height: 35px;  
      padding: 2px;  
      border: 1px solid var(--border);  
      border-radius: 8px;  
      background-color: var(--surface-2);  
      cursor: pointer;  
    }  
  </style>  
</head>  
<body>  
  <!-- Contenedor principal a pantalla completa sobre fondo oscuro continuo (#090b10) -->  
  <div class="app-shell">  
    <!-- Cabecera minimalista sin bordes blancos ni elementos externos -->  
    <header class="flex items-center justify-between gap-2.5 mb-3">  
      <div class="flex items-baseline gap-2.5 min-w-0">  
        <h1 class="m-0 text-xl font-bold tracking-tight text-[#f3f5f8]">Habilidades</h1>  
        <span id="saveStatus" class="text-xs font-medium text-[#22c55e] transition-opacity duration-200">Guardado</span>  
      </div>  
      <div id="summaryText" class="text-xs text-[#8f98ad] whitespace-nowrap">0 hÃ¡bitos Â· Nv. mÃ¡x. 1</div>  
    </header>  
  
    <!-- Selector de pestaÃ±as -->  
    <nav class="surface-card grid grid-cols-2 gap-1.5 p-1 mb-3" aria-label="NavegaciÃ³n principal">  
      <button  
        id="tabHabits"  
        type="button"  
        class="py-2 px-3 rounded-lg text-sm font-semibold transition-colors bg-[#171c29] text-[#f3f5f8] cursor-pointer"  
      >  
        Habilidades  
      </button>  
      <button  
        id="tabSettings"  
        type="button"  
        class="py-2 px-3 rounded-lg text-sm font-semibold transition-colors bg-transparent text-[#8f98ad] cursor-pointer"  
      >  
        Ajustes  
      </button>  
    </nav>  
  
    <!-- Banner de aviso no intrusivo para errores o confirmaciones (sin alert/confirm) -->  
    <div  
      id="noticeBanner"  
      class="hidden surface-card px-3 py-2 mb-3 text-xs text-[#f3f5f8] flex items-center justify-between gap-2"  
      role="status"  
    >  
      <span id="noticeText"></span>  
      <button id="dismissNoticeBtn" type="button" class="text-[#8f98ad] hover:text-white text-xs font-semibold px-1.5 py-0.5 cursor-pointer">  
        Cerrar  
      </button>  
    </div>  
  
    <!-- Vista principal de hÃ¡bitos compactos -->  
    <main id="viewHabits" class="block">  
      <div id="habitList" class="flex flex-col gap-2"></div>  
    </main>  
  
    <!-- Vista de ajustes y gestiÃ³n completa -->  
    <section id="viewSettings" class="hidden space-y-2.5">  
      <!-- Crear nuevo hÃ¡bito -->  
      <div class="surface-card p-3">  
        <h2 class="m-0 mb-2.5 text-sm font-bold text-[#f3f5f8]">Nuevo hÃ¡bito</h2>  
        <div class="grid grid-cols-[1fr_84px_52px] gap-2 mb-2">  
          <input id="newName" type="text" placeholder="Nombre del hÃ¡bito" maxlength="40" aria-label="Nombre del hÃ¡bito" />  
          <input id="newStep" type="number" min="1" max="100" value="1" title="XP por pulsaciÃ³n" aria-label="XP por pulsaciÃ³n" />  
          <input id="newColor" type="color" value="#38bdf8" title="Color del hÃ¡bito" aria-label="Color del hÃ¡bito" />  
        </div>  
        <button  
          id="addHabitBtn"  
          type="button"  
          class="action-btn primary w-full py-2"  
          style="background-color: var(--accent);"  
        >  
          AÃ±adir hÃ¡bito  
        </button>  
      </div>  
  
      <!-- Preferencias rÃ¡pidas -->  
      <div class="surface-card p-3 flex items-center justify-between gap-3">  
        <div>  
          <h2 class="m-0 text-sm font-bold text-[#f3f5f8]">Sonido sutil al subir de nivel</h2>  
          <p class="m-0 text-xs text-[#8f98ad]">Tono suave generado al completar el 100% de XP.</p>  
        </div>  
        <button id="toggleSoundBtn" type="button" class="action-btn shrink-0">Activado</button>  
      </div>  
  
      <!-- Lista de gestiÃ³n de hÃ¡bitos -->  
      <div class="surface-card p-3">  
        <h2 class="m-0 mb-2 text-sm font-bold text-[#f3f5f8]">Gestionar hÃ¡bitos</h2>  
        <div id="manageList" class="divide-y divide-[rgba(255,255,255,0.08)]"></div>  
      </div>  
  
      <!-- Copia de seguridad JSON y reinicio total -->  
      <div class="surface-card p-3">  
        <h2 class="m-0 mb-2.5 text-sm font-bold text-[#f3f5f8]">Copia de seguridad y datos</h2>  
        <div class="flex flex-wrap gap-1.5">  
          <button id="exportBtn" type="button" class="action-btn">Exportar JSON</button>  
          <button id="importBtn" type="button" class="action-btn">Importar JSON</button>  
          <button id="resetAllBtn" type="button" class="action-btn danger">Reiniciar todo</button>  
        </div>  
        <textarea  
          id="jsonBox"  
          class="mt-2.5 min-h-[84px] font-mono text-xs"  
          placeholder="Pulsa Exportar JSON para generar tu copia o pega aquÃ­ un JSON para importar..."  
          aria-label="Respaldo JSON"  
        ></textarea>  
      </div>  
    </section>  
  </div>  
  
  <script>  
    // Clave Ãºnica de almacenamiento local para persistencia inmediata  
    const STORAGE_KEY = "habilidades_tracker_state_v2";  
  
    // Estado inicial por defecto  
    const DEFAULT_STATE = {  
      soundEnabled: true,  
      habits: [  
        { id: "h_lectura", name: "Lectura", level: 1, xp: 0, step: 1, color: "#f59e0b" },  
        { id: "h_entreno", name: "Entreno", level: 1, xp: 0, step: 1, color: "#22c55e" },  
        { id: "h_ingles", name: "InglÃ©s", level: 1, xp: 0, step: 1, color: "#38bdf8" }  
      ]  
    };  
  
    /**  
     * Genera un ID Ãºnico sencillo para cada hÃ¡bito.  
     */  
    function createId() {  
      return "h_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6);  
    }  
  
    /**  
     * Normaliza y valida la estructura de datos cargada desde localStorage o JSON.  
     */  
    function sanitizeState(rawObj) {  
      const base = {  
        soundEnabled: typeof rawObj?.soundEnabled === "boolean" ? rawObj.soundEnabled : true,  
        habits: []  
      };  
  
      if (!Array.isArray(rawObj?.habits)) {  
        return structuredClone(DEFAULT_STATE);  
      }  
  
      base.habits = rawObj.habits.map((item, index) => {  
        const cleanName = String(item?.name ?? `HÃ¡bito ${index + 1}`).trim().slice(0, 40) || `HÃ¡bito ${index + 1}`;  
        const parsedLevel = Number(item?.level);  
        const parsedXp = Number(item?.xp);  
        const parsedStep = Number(item?.step);  
        const cleanColor = /^#[0-9a-fA-F]{6}$/.test(String(item?.color || "")) ? item.color : "#38bdf8";  
  
        return {  
          id: typeof item?.id === "string" && item.id.trim() ? item.id.trim() : createId(),  
          name: cleanName,  
          level: Number.isFinite(parsedLevel) ? Math.max(1, Math.floor(parsedLevel)) : 1,  
          xp: Number.isFinite(parsedXp) ? Math.max(0, Math.min(99, Math.floor(parsedXp))) : 0,  
          step: Number.isFinite(parsedStep) ? Math.max(1, Math.min(100, Math.floor(parsedStep))) : 1,  
          color: cleanColor  
        };  
      });  
  
      return base;  
    }  
  
    /**  
     * Carga el estado desde localStorage con manejo seguro de errores.  
     */  
    function loadState() {  
      try {  
        const saved = localStorage.getItem(STORAGE_KEY);  
        if (!saved) {  
          return structuredClone(DEFAULT_STATE);  
        }  
        return sanitizeState(JSON.parse(saved));  
      } catch (err) {  
        showNotice("No se pudo leer el almacenamiento previo; se ha iniciado con valores base.");  
        return structuredClone(DEFAULT_STATE);  
      }  
    }  
  
    let state = loadState();  
    let badgeTimer = null;  
    let audioCtx = null;  
  
    /**  
     * Muestra un aviso discreto en pantalla sin usar alert() ni confirm().  
     */  
    function showNotice(message) {  
      const banner = document.getElementById("noticeBanner");  
      const textEl = document.getElementById("noticeText");  
      if (!banner || !textEl) return;  
      textEl.textContent = message;  
      banner.classList.remove("hidden");  
    }  
  
    function hideNotice() {  
      const banner = document.getElementById("noticeBanner");  
      if (banner) banner.classList.add("hidden");  
    }  
  
    /**  
     * Reproduce un tono breve y suave con Web Audio API al subir de nivel.  
     */  
    function playLevelUpSound() {  
      if (!state.soundEnabled) return;  
      try {  
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;  
        if (!AudioContextClass) return;  
        if (!audioCtx) {  
          audioCtx = new AudioContextClass();  
        }  
        if (audioCtx.state === "suspended") {  
          audioCtx.resume();  
        }  
        const now = audioCtx.currentTime;  
        const osc = audioCtx.createOscillator();  
        const gain = audioCtx.createGain();  
        osc.type = "sine";  
        osc.frequency.setValueAtTime(523.25, now);  
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.14);  
  
        gain.gain.setValueAtTime(0.001, now);  
        gain.gain.exponentialRampToValueAtTime(0.06, now + 0.02);  
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);  
  
        osc.connect(gain);  
        gain.connect(audioCtx.destination);  
        osc.start(now);  
        osc.stop(now + 0.19);  
      } catch {  
        // Ignorar si el navegador bloquea el audio hasta interacciÃ³n directa  
      }  
    }  
  
    /**  
     * Guarda inmediatamente el estado completo en localStorage y actualiza el indicador.  
     */  
    function saveState() {  
      const statusEl = document.getElementById("saveStatus");  
      try {  
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));  
        if (statusEl) {  
          statusEl.textContent = "Autoguardado";  
          statusEl.classList.remove("text-[#ef4444]");  
          statusEl.classList.add("text-[#22c55e]");  
          clearTimeout(badgeTimer);  
          badgeTimer = setTimeout(() => {  
            statusEl.textContent = "Guardado";  
          }, 950);  
        }  
      } catch (err) {  
        if (statusEl) {  
          statusEl.textContent = "Sin guardar";  
          statusEl.classList.remove("text-[#22c55e]");  
          statusEl.classList.add("text-[#ef4444]");  
        }  
        showNotice("El navegador bloqueÃ³ el guardado local. Revisa los ajustes de Safari o usa Exportar JSON.");  
      }  
    }  
  
    /**  
     * Aplica un cambio de XP a un hÃ¡bito gestionando subidas y bajadas de nivel.  
     */  
    function applyXp(habit, delta) {  
      let total = habit.xp + delta;  
      let leveledUp = false;  
  
      while (total >= 100) {  
        total -= 100;  
        habit.level += 1;  
        leveledUp = true;  
      }  
  
      while (total < 0) {  
        if (habit.level > 1) {  
          habit.level -= 1;  
          total += 100;  
        } else {  
          total = 0;  
          break;  
        }  
      }  
  
      habit.xp = total;  
      if (leveledUp) {  
        playLevelUpSound();  
      }  
      saveState();  
      render();  
    }  
  
    /**  
     * Actualiza el contador resumido de hÃ¡bitos y nivel mÃ¡ximo.  
     */  
    function updateSummary() {  
      const summaryEl = document.getElementById("summaryText");  
      if (!summaryEl) return;  
      const totalHabits = state.habits.length;  
      const maxLevel = totalHabits ? Math.max(...state.habits.map((h) => h.level)) : 1;  
      summaryEl.textContent = `${totalHabits} hÃ¡bitos Â· Nv. mÃ¡x. ${maxLevel}`;  
    }  
  
    /**  
     * Renderiza la lista compacta de hÃ¡bitos en la pestaÃ±a principal.  
     */  
    function renderHabits() {  
      const container = document.getElementById("habitList");  
      if (!container) return;  
  
      if (!state.habits.length) {  
        container.innerHTML = `  
          <div class="surface-card py-8 px-4 text-center text-sm text-[#8f98ad]">  
            No hay hÃ¡bitos todavÃ­a. Crea uno en la pestaÃ±a Ajustes.  
          </div>  
        `;  
        return;  
      }  
  
      container.innerHTML = state.habits  
        .map(  
          (h) => `  
          <article class="surface-card px-3 py-2.5">  
            <div class="flex items-center justify-between gap-2">  
              <div class="flex items-center gap-2 min-w-0">  
                <span class="w-2 h-2 rounded-full shrink-0" style="background-color:${h.color};"></span>  
                <span class="text-sm font-semibold text-[#f3f5f8] truncate">${escapeHtml(h.name)}</span>  
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#171c29] text-[#f3f5f8] shrink-0">  
                  Nv. ${h.level}  
                </span>  
              </div>  
              <div class="flex items-center gap-1.5 shrink-0">  
                <button type="button" class="action-btn" onclick="handleStep('${h.id}', -1)" aria-label="Restar 1% a ${escapeAttr(h.name)}">-1%</button>  
                <button  
                  type="button"  
                  class="action-btn primary"  
                  style="background-color:${h.color};"  
                  onclick="handleStep('${h.id}', 1)"  
                  aria-label="Sumar ${h.step}% a ${escapeAttr(h.name)}"  
                >  
                  +${h.step}%  
                </button>  
              </div>  
            </div>  
            <div class="flex items-center gap-2.5 mt-2">  
              <div class="bar-track">  
                <div class="bar-fill" style="width:${h.xp}%; background-color:${h.color};"></div>  
              </div>  
              <span class="text-xs font-semibold text-[#8f98ad] min-w-[36px] text-right">${h.xp}%</span>  
            </div>  
          </article>  
        `  
        )  
        .join("");  
    }  
  
    /**  
     * Renderiza las herramientas de ediciÃ³n, ordenaciÃ³n, duplicado, reset y borrado en Ajustes.  
     */  
    function renderManage() {  
      const container = document.getElementById("manageList");  
      const soundBtn = document.getElementById("toggleSoundBtn");  
      if (soundBtn) {  
        soundBtn.textContent = state.soundEnabled ? "Activado" : "Desactivado";  
      }  
  
      if (!container) return;  
  
      if (!state.habits.length) {  
        container.innerHTML = `<div class="py-6 text-center text-xs text-[#8f98ad]">No hay hÃ¡bitos configurados.</div>`;  
        return;  
      }  
  
      container.innerHTML = state.habits  
        .map(  
          (h, idx) => `  
          <div class="py-2.5 first:pt-0 last:pb-0 space-y-2">  
            <div class="flex items-center justify-between gap-2">  
              <span class="text-xs font-bold text-[#f3f5f8] truncate">${escapeHtml(h.name)}</span>  
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#171c29] text-[#8f98ad] shrink-0">  
                Nv. ${h.level} Â· ${h.xp}% Â· +${h.step}%  
              </span>  
            </div>  
            <div class="grid grid-cols-[1fr_46px_68px_68px] gap-1.5">  
              <input  
                type="text"  
                value="${escapeAttr(h.name)}"  
                aria-label="Nombre de ${escapeAttr(h.name)}"  
                onchange="editHabitField('${h.id}', 'name', this.value)"  
              />  
              <input  
                type="color"  
                value="${h.color}"  
                aria-label="Color de ${escapeAttr(h.name)}"  
                onchange="editHabitField('${h.id}', 'color', this.value)"  
              />  
              <input  
                type="number"  
                min="1"  
                max="999"  
                value="${h.level}"  
                aria-label="Nivel de ${escapeAttr(h.name)}"  
                onchange="editHabitField('${h.id}', 'level', this.value)"  
              />  
              <input  
                type="number"  
                min="0"  
                max="99"  
                value="${h.xp}"  
                aria-label="Porcentaje XP de ${escapeAttr(h.name)}"  
                onchange="editHabitField('${h.id}', 'xp', this.value)"  
              />  
            </div>  
            <div class="flex flex-wrap gap-1.5">  
              <button type="button" class="action-btn" ${idx === 0 ? "disabled" : ""} onclick="moveHabit(${idx}, -1)">Subir</button>  
              <button type="button" class="action-btn" ${idx === state.habits.length - 1 ? "disabled" : ""} onclick="moveHabit(${idx}, 1)">Bajar</button>  
              <button type="button" class="action-btn" onclick="duplicateHabit('${h.id}')">Duplicar</button>  
              <button type="button" class="action-btn" onclick="resetSingleHabit('${h.id}')">Reset</button>  
              <button type="button" class="action-btn danger" onclick="deleteSingleHabit('${h.id}')">Borrar</button>  
            </div>  
          </div>  
        `  
        )  
        .join("");  
    }  
  
    /**  
     * Renderiza toda la interfaz.  
     */  
    function render() {  
      updateSummary();  
      renderHabits();  
      renderManage();  
    }  
  
    // Acciones globales invocadas desde elementos generados dinÃ¡micamente  
    window.handleStep = function (id, direction) {  
      const habit = state.habits.find((h) => h.id === id);  
      if (!habit) return;  
      applyXp(habit, direction > 0 ? habit.step : -1);  
    };  
  
    window.editHabitField = function (id, field, value) {  
      const habit = state.habits.find((h) => h.id === id);  
      if (!habit) return;  
  
      if (field === "name") {  
        habit.name = String(value || "").trim().slice(0, 40) || "HÃ¡bito";  
      } else if (field === "color") {  
        if (/^#[0-9a-fA-F]{6}$/.test(value)) {  
          habit.color = value;  
        }  
      } else if (field === "level") {  
        habit.level = Math.max(1, Math.min(999, Math.floor(Number(value) || 1)));  
      } else if (field === "xp") {  
        habit.xp = Math.max(0, Math.min(99, Math.floor(Number(value) || 0)));  
      }  
  
      saveState();  
      render();  
    };  
  
    window.moveHabit = function (index, offset) {  
      const targetIndex = index + offset;  
      if (targetIndex < 0 || targetIndex >= state.habits.length) return;  
      const [moved] = state.habits.splice(index, 1);  
      state.habits.splice(targetIndex, 0, moved);  
      saveState();  
      render();  
    };  
  
    window.duplicateHabit = function (id) {  
      const original = state.habits.find((h) => h.id === id);  
      if (!original) return;  
      const copyName = `${original.name} (copia)`.slice(0, 40);  
      state.habits.push({  
        ...original,  
        id: createId(),  
        name: copyName  
      });  
      saveState();  
      render();  
    };  
  
    window.resetSingleHabit = function (id) {  
      const habit = state.habits.find((h) => h.id === id);  
      if (!habit) return;  
      habit.level = 1;  
      habit.xp = 0;  
      saveState();  
      render();  
    };  
  
    window.deleteSingleHabit = function (id) {  
      state.habits = state.habits.filter((h) => h.id !== id);  
      saveState();  
      render();  
    };  
  
    // Listeners estÃ¡ticos de la interfaz  
    document.getElementById("addHabitBtn").addEventListener("click", () => {  
      const nameEl = document.getElementById("newName");  
      const stepEl = document.getElementById("newStep");  
      const colorEl = document.getElementById("newColor");  
  
      const cleanName = nameEl.value.trim().slice(0, 40);  
      if (!cleanName) {  
        showNotice("Escribe un nombre para el nuevo hÃ¡bito antes de aÃ±adirlo.");  
        return;  
      }  
  
      const stepVal = Math.max(1, Math.min(100, Math.floor(Number(stepEl.value) || 1)));  
      const colorVal = /^#[0-9a-fA-F]{6}$/.test(colorEl.value) ? colorEl.value : "#38bdf8";  
  
      state.habits.push({  
        id: createId(),  
        name: cleanName,  
        level: 1,  
        xp: 0,  
        step: stepVal,  
        color: colorVal  
      });  
  
      nameEl.value = "";  
      hideNotice();  
      saveState();  
      render();  
    });  
  
    document.getElementById("toggleSoundBtn").addEventListener("click", () => {  
      state.soundEnabled = !state.soundEnabled;  
      saveState();  
      renderManage();  
    });  
  
    document.getElementById("exportBtn").addEventListener("click", () => {  
      const box = document.getElementById("jsonBox");  
      box.value = JSON.stringify(state, null, 2);  
      try {  
        box.focus();  
        box.select();  
        document.execCommand("copy");  
        showNotice("Copia JSON generada y copiada al portapapeles.");  
      } catch {  
        showNotice("Copia JSON generada en el cuadro de texto.");  
      }  
    });  
  
    document.getElementById("importBtn").addEventListener("click", () => {  
      const rawText = document.getElementById("jsonBox").value.trim();  
      if (!rawText) {  
        showNotice("Pega primero un JSON vÃ¡lido en el cuadro de texto para importar.");  
        return;  
      }  
  
      try {  
        const parsed = JSON.parse(rawText);  
        if (!parsed || !Array.isArray(parsed.habits)) {  
          showNotice("El JSON no contiene una lista de hÃ¡bitos vÃ¡lida.");  
          return;  
        }  
        state = sanitizeState(parsed);  
        saveState();  
        render();  
        showNotice("Datos importados y guardados correctamente.");  
      } catch {  
        showNotice("No se pudo interpretar el JSON. Revisa el formato e intÃ©ntalo de nuevo.");  
      }  
    });  
  
    document.getElementById("resetAllBtn").addEventListener("click", () => {  
      state = structuredClone(DEFAULT_STATE);  
      saveState();  
      render();  
      showNotice("Se han restablecido todos los hÃ¡bitos a sus valores iniciales.");  
    });  
  
    document.getElementById("dismissNoticeBtn").addEventListener("click", hideNotice);  
  
    // Cambio entre pestaÃ±as Habilidades y Ajustes  
    const tabHabits = document.getElementById("tabHabits");  
    const tabSettings = document.getElementById("tabSettings");  
    const viewHabits = document.getElementById("viewHabits");  
    const viewSettings = document.getElementById("viewSettings");  
  
    tabHabits.addEventListener("click", () => {  
      tabHabits.classList.add("bg-[#171c29]", "text-[#f3f5f8]");  
      tabHabits.classList.remove("bg-transparent", "text-[#8f98ad]");  
      tabSettings.classList.remove("bg-[#171c29]", "text-[#f3f5f8]");  
      tabSettings.classList.add("bg-transparent", "text-[#8f98ad]");  
  
      viewHabits.classList.remove("hidden");  
      viewHabits.classList.add("block");  
      viewSettings.classList.remove("block");  
      viewSettings.classList.add("hidden");  
    });  
  
    tabSettings.addEventListener("click", () => {  
      tabSettings.classList.add("bg-[#171c29]", "text-[#f3f5f8]");  
      tabSettings.classList.remove("bg-transparent", "text-[#8f98ad]");  
      tabHabits.classList.remove("bg-[#171c29]", "text-[#f3f5f8]");  
      tabHabits.classList.add("bg-transparent", "text-[#8f98ad]");  
  
      viewSettings.classList.remove("hidden");  
      viewSettings.classList.add("block");  
      viewHabits.classList.remove("block");  
      viewHabits.classList.add("hidden");  
    });  
  
    // Escapes seguros para texto y atributos HTML  
    function escapeHtml(value) {  
      return String(value).replace(/[&<>"']/g, (char) => ({  
        "&": "&amp;",  
        "<": "&lt;",  
        ">": "&gt;",  
        '"': "&quot;",  
        "'": "&#39;"  
      }[char]));  
    }  
  
    function escapeAttr(value) {  
      return escapeHtml(value).replace(/`/g, "&#96;");  
    }  
  
    // InicializaciÃ³n inmediata  
    render();  
  </script>  
</body>  
</html>
